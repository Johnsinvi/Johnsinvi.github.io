<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>John Pereyra — Data Analytics</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d0d0d;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1.75rem 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f1f1f;
    }

    header h1 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #ffffff;
    }

    header nav a {
      color: #666;
      text-decoration: none;
      font-size: 0.875rem;
      transition: color 0.2s;
    }

    header nav a:hover { color: #ffffff; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 3rem 2.5rem 2rem;
      max-width: 1160px;
      width: 100%;
      margin: 0 auto;
      gap: 1.75rem;
    }

    .hero h2 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
      margin-bottom: 0.4rem;
    }

    .hero p {
      font-size: 0.9rem;
      color: #555;
      max-width: 500px;
    }

    .dashboard-wrapper {
      background: #111;
      border: 1px solid #1f1f1f;
      border-radius: 8px;
      overflow: hidden;
    }

    .dashboard-label {
      padding: 0.875rem 1.25rem;
      border-bottom: 1px solid #1f1f1f;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .dashboard-label span {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #444;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #f47c3c;
      flex-shrink: 0;
    }

    iframe {
      display: block;
      width: 100%;
      height: 680px;
      border: none;
    }

    footer {
      text-align: center;
      padding: 1.25rem;
      font-size: 0.75rem;
      color: #2e2e2e;
      border-top: 1px solid #161616;
    }

    footer a { color: #383838; text-decoration: none; transition: color 0.2s; }
    footer a:hover { color: #666; }

    @media (max-width: 640px) {
      header { padding: 1.25rem; }
      main { padding: 2rem 1.25rem 1rem; }
      .hero h2 { font-size: 1.3rem; }
      iframe { height: 480px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>John Pereyra</h1>
    <nav>
      <a href="https://www.linkedin.com/in/john-pereyra-483a23109" target="_blank" rel="noopener">LinkedIn</a>
    </nav>
  </header>

  <main>
    <div class="hero">
      <h2>NBA Team Performance Dashboard</h2>
      <p>Interactive analysis of NBA team stats — win rates, scoring trends, and home/away breakdowns.</p>
    </div>

    <div class="dashboard-wrapper">
      <div class="dashboard-label">
        <div class="dot"></div>
        <span>Power BI · Live</span>
      </div>
      <iframe
        title="NBA Team Performance Dashboard"
        src="https://app.powerbi.com/view?r=eyJrIjoiYzNkMTBlZWQtMzczNS00ZTIyLWIzZTgtY2I4NTEyYjA3YTI4IiwidCI6IjVkNjE0ZDU2LWJiYjItNGZlNC1iOTI2LWFlNTQzMjdkYjcyMiIsImMiOjR9"
        allowFullScreen
      ></iframe>
    </div>
  </main>

  <footer>
    <a href="https://cleardatareport.com">cleardatareport.com</a>
  </footer>

</body>
</html>
